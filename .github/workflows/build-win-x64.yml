name: Build Windows x64 (CUDA + Vulkan + CPU)

# Standalone, minimal workflow for the LSXAxeller/llama.cpp-adaptive-kv-streaming fork.
# Builds ONLY Windows x64 binaries: CPU (full toolset with embedded web UI) +
# CUDA 13.4 backend + Vulkan backend.
# No macOS / Linux / Android / SYCL / OpenVINO / ROCm / Docker / release-publish machinery.
#
# Trigger: manual only (Actions tab -> "Build Windows x64" -> Run workflow).
# Tick/untick the three booleans to choose which backends to build.
#
# ARTIFACT REUSE:
#   By default, if the previous run of this workflow succeeded and produced
#   a backend's artifact, that artifact is re-downloaded and re-uploaded into
#   the current run (cheap, ~30s on Ubuntu) instead of rebuilding from scratch
#   (~10 min on Windows). This lets you iterate on one backend without paying
#   the build cost for the others you haven't touched.
#   Tick "force_rebuild" to bypass reuse and rebuild everything from scratch.

on:
  workflow_dispatch:
    inputs:
      build_cpu:
        description: 'Build CPU (llama-server + tools + ggml-cpu)'
        required: true
        type: boolean
        default: true
      build_cuda:
        description: 'Build CUDA 13.4 backend (ggml-cuda.dll + cudart)'
        required: true
        type: boolean
        default: true
      build_vulkan:
        description: 'Build Vulkan backend (ggml-vulkan.dll)'
        required: true
        type: boolean
        default: true
      force_rebuild:
        description: 'Force rebuild — ignore reusable artifacts from previous runs'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read   # needed to list previous workflow runs and download their artifacts

# Same env var the upstream release.yml uses for the CPU build.
env:
  CMAKE_ARGS: "-DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_TOOLS=ON -DLLAMA_BUILD_SERVER=ON -DGGML_RPC=ON"

concurrency:
  group: build-win-x64
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # JOB 0: Preflight — find the last successful run of this workflow and check
  # which backend artifacts it produced. Sets outputs that gate the reuse vs.
  # build decision for each backend below.
  # ---------------------------------------------------------------------------
  preflight:
    name: Preflight (reuse check)
    runs-on: ubuntu-latest
    outputs:
      prev_run_id:      ${{ steps.find.outputs.prev_run_id }}
      reuse_cuda:       ${{ steps.check.outputs.reuse_cuda }}
      reuse_cudart:     ${{ steps.check.outputs.reuse_cudart }}
      reuse_vulkan:     ${{ steps.check.outputs.reuse_vulkan }}

    steps:
      - name: Find last successful run
        id: find
        if: ${{ inputs.force_rebuild != true }}
        uses: actions/github-script@v8
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: context.workflow,
              status: 'success',
              per_page: 10
            });
            // Exclude the current run.
            const prev = runs.data.workflow_runs.find(r => r.id !== context.runId);
            if (prev) {
              core.setOutput('prev_run_id', prev.id);
              core.info(`Previous successful run: ${prev.html_url}`);
              core.info(`  commit: ${prev.head_sha?.slice(0,12) ?? '?'}`);
              core.info(`  branch: ${prev.head_branch}`);
            } else {
              core.info('No previous successful run found.');
            }

      - name: Check available artifacts in previous run
        id: check
        if: ${{ steps.find.outputs.prev_run_id != '' }}
        uses: actions/github-script@v8
        with:
          script: |
            const runId = Number('${{ steps.find.outputs.prev_run_id }}');
            const arts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId
            });
            const names = arts.data.artifacts.map(a => a.name);
            core.info(`Artifacts in run ${runId}: ${names.join(', ') || '(none)'}`);
            core.setOutput('reuse_cuda',   String(names.includes('win-cuda-x64')));
            core.setOutput('reuse_cudart', String(names.includes('win-cuda-x64-cudart')));
            core.setOutput('reuse_vulkan', String(names.includes('win-vulkan-x64')));

  # ---------------------------------------------------------------------------
  # JOB 0a: Build the embedded web UI (Node.js, runs on Ubuntu).
  # Only runs when build_cpu is true AND CPU is not being reused from a prev run.
  # ---------------------------------------------------------------------------
  ui-build:
    name: Web UI (embedded)
    if: ${{ inputs.build_cpu }}
    needs: [preflight]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve UI version
        id: version
        run: |
          version="b$(git rev-list --count HEAD)"
          echo "ui_version=${version}" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci
        working-directory: tools/ui

      - name: Build application
        env:
          LLAMA_BUILD_NUMBER: ${{ steps.version.outputs.ui_version }}
        run: npm run build
        working-directory: tools/ui

      - name: Upload built UI
        uses: actions/upload-artifact@v7
        with:
          name: llama-ui
          path: tools/ui/dist/
          retention-days: 1
          if-no-files-found: error

  # ===========================================================================
  # CPU PATH (always builds fresh — this is the path most commonly iterated on)
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # JOB 1: Windows CPU x64 — full toolset (llama-server with embedded web UI,
  # llama-cli, ggml-cpu, ...).
  # ---------------------------------------------------------------------------
  win-cpu-x64:
    name: CPU x64 (full toolset)
    if: ${{ inputs.build_cpu }}
    needs: [preflight, ui-build]
    runs-on: windows-2025-vs2026

    steps:
      - name: Clone
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download UI build
        uses: actions/download-artifact@v8
        with:
          name: llama-ui
          path: tools/ui/dist

      - name: Patch fork symbol-export bugs (idempotent)
        # The fork's src/llama-context-memory.h declares several methods WITHOUT
        # the LLAMA_API export macro, so they don't cross the llama.dll boundary
        # on Windows shared builds. Only borrows_serial_parent() is referenced
        # from tools/server today, so that's the one that breaks the link.
        # This step adds LLAMA_API to the declaration if (and only if) it's
        # missing. Once the source is fixed upstream/in-fork, this becomes a no-op.
        shell: pwsh
        run: |
          $f = 'src/llama-context-memory.h'
          if (-not (Test-Path $f)) { Write-Host "File not found: $f — skipping patch"; exit 0 }
          $content = Get-Content $f -Raw
          $pattern = '(?m)(^\s+)bool borrows_serial_parent\(\) const noexcept;'
          if ($content -match $pattern) {
              $patched = $content -replace $pattern, '$1LLAMA_API bool borrows_serial_parent() const noexcept;'
              Set-Content $f -Value $patched -NoNewline
              Write-Host "Patched: added LLAMA_API to borrows_serial_parent() in $f"
          } else {
              Write-Host "No patch needed — LLAMA_API already present (or pattern changed)."
          }

      - name: Install Ninja
        run: choco install ninja --no-progress

      - name: ccache
        uses: ggml-org/ccache-action@v1.2.24
        with:
          key: win-x64-cpu
          evict-old-files: 1d

      - name: Build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake -S . -B build -G "Ninja Multi-Config" ^
            -D CMAKE_TOOLCHAIN_FILE=cmake/x64-windows-llvm.cmake ^
            -DLLAMA_BUILD_BORINGSSL=ON ^
            -DGGML_NATIVE=OFF ^
            -DGGML_BACKEND_DL=ON ^
            -DGGML_CPU_ALL_VARIANTS=ON ^
            -DGGML_OPENMP=ON ^
            -DGGML_OPENMP_FETCH=ON ^
            ${{ env.CMAKE_ARGS }}
          cmake --build build --config Release

      - name: Pack
        shell: pwsh
        run: 7z a -snl llama-bin-win-cpu-x64.zip .\build\bin\Release\*

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: win-cpu-x64
          path: llama-bin-win-cpu-x64.zip
          archive: false
          if-no-files-found: error

  # ===========================================================================
  # CUDA PATH — two mutually exclusive jobs:
  #   reuse-cuda-x64  : if previous run has the artifact, re-download + re-upload (cheap)
  #   win-cuda-x64    : else build from scratch (~10 min)
  # Both produce the same artifacts (win-cuda-x64, win-cuda-x64-cudart), so the
  # package job downstream doesn't care which one ran.
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # JOB 2a: Reuse CUDA artifacts from previous successful run
  # ---------------------------------------------------------------------------
  reuse-cuda-x64:
    name: CUDA 13.4 x64 (reuse from prev run)
    if: ${{ inputs.build_cuda && needs.preflight.outputs.reuse_cuda == 'true' }}
    needs: [preflight]
    runs-on: ubuntu-latest

    steps:
      - name: Download ggml-cuda artifact from previous run
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ needs.preflight.outputs.prev_run_id }}
          name: win-cuda-x64
          path: ./cuda
          github-token: ${{ github.token }}

      - name: Download cudart artifact from previous run
        if: ${{ needs.preflight.outputs.reuse_cudart == 'true' }}
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ needs.preflight.outputs.prev_run_id }}
          name: win-cuda-x64-cudart
          path: ./cudart
          github-token: ${{ github.token }}

      - name: Re-upload ggml-cuda in current run
        uses: actions/upload-artifact@v7
        with:
          name: win-cuda-x64
          path: ./cuda/*
          archive: false
          if-no-files-found: error

      - name: Re-upload cudart in current run
        if: ${{ needs.preflight.outputs.reuse_cudart == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: win-cuda-x64-cudart
          path: ./cudart/*
          archive: false
          if-no-files-found: error

      - name: Summary
        run: |
          echo "Reused CUDA artifacts from run ${{ needs.preflight.outputs.prev_run_id }}"
          echo "  ggml-cuda:  $([ -f ./cuda/llama-bin-win-cuda-13.4-x64.zip ] && echo 'yes' || echo 'NO')"
          echo "  cudart:     $([ -f ./cudart/cudart-llama-bin-win-cuda-13.4-x64.zip ] && echo 'yes' || echo 'no (will not be present in final bundle)')"

  # ---------------------------------------------------------------------------
  # JOB 2b: Build CUDA 13.4 x64 from scratch
  # ---------------------------------------------------------------------------
  win-cuda-x64:
    name: CUDA 13.4 x64 (build)
    if: ${{ inputs.build_cuda && needs.preflight.outputs.reuse_cuda != 'true' }}
    needs: [preflight]
    runs-on: windows-2022

    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: Install CUDA Toolkit 13.4 (x64)
        uses: ./.github/actions/windows-setup-cuda
        with:
          cuda_version: '13.4'
          cuda_arch: 'x64'

      - name: Install Ninja
        run: choco install ninja --no-progress

      - name: ccache
        uses: ggml-org/ccache-action@v1.2.24
        with:
          key: win-x64-cuda-13.4
          evict-old-files: 1d

      - name: Build ggml-cuda
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake -S . -B build -G "Ninja Multi-Config" ^
            -DGGML_BACKEND_DL=ON ^
            -DGGML_NATIVE=OFF ^
            -DGGML_CPU=OFF ^
            -DGGML_CUDA=ON ^
            -DLLAMA_BUILD_BORINGSSL=ON ^
            -DGGML_CUDA_CCCL_VERSION=v3.4.3 ^
            -DLLAMA_BUILD_TESTS=OFF ^
            -DLLAMA_BUILD_EXAMPLES=OFF
          set /A NINJA_JOBS=%NUMBER_OF_PROCESSORS%-1
          cmake --build build --config Release -j %NINJA_JOBS% --target ggml-cuda

      - name: Pack ggml-cuda.dll
        shell: pwsh
        run: 7z a -snl llama-bin-win-cuda-13.4-x64.zip .\build\bin\Release\ggml-cuda.dll

      - name: Pack CUDA runtime DLLs
        shell: pwsh
        run: |
          $dst = '.\build\bin\cudart\'
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          # robocopy exit codes 0-7 are success; only 8+ are fatal.
          # Reset $LASTEXITCODE so the step doesn't fail on "1 = files copied OK".
          robocopy "${{ env.CUDA_PATH }}\bin"     $dst cudart64_*.dll cublas64_*.dll cublasLt64_*.dll
          if ($LASTEXITCODE -ge 8) { throw "robocopy (bin) failed with exit code $LASTEXITCODE" }
          robocopy "${{ env.CUDA_PATH }}\lib"     $dst cudart64_*.dll cublas64_*.dll cublasLt64_*.dll
          if ($LASTEXITCODE -ge 8) { throw "robocopy (lib) failed with exit code $LASTEXITCODE" }
          robocopy "${{ env.CUDA_PATH }}\bin\x64" $dst cudart64_*.dll cublas64_*.dll cublasLt64_*.dll
          if ($LASTEXITCODE -ge 8) { throw "robocopy (bin\x64) failed with exit code $LASTEXITCODE" }
          $global:LASTEXITCODE = 0
          7z a cudart-llama-bin-win-cuda-13.4-x64.zip $dst\*

      - name: Upload ggml-cuda
        uses: actions/upload-artifact@v7
        with:
          name: win-cuda-x64
          path: llama-bin-win-cuda-13.4-x64.zip
          archive: false
          if-no-files-found: error

      - name: Upload cudart
        uses: actions/upload-artifact@v7
        with:
          name: win-cuda-x64-cudart
          path: cudart-llama-bin-win-cuda-13.4-x64.zip
          archive: false
          if-no-files-found: error

  # ===========================================================================
  # VULKAN PATH — same reuse-or-build pattern as CUDA
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # JOB 3a: Reuse Vulkan artifact from previous successful run
  # ---------------------------------------------------------------------------
  reuse-vulkan-x64:
    name: Vulkan x64 (reuse from prev run)
    if: ${{ inputs.build_vulkan && needs.preflight.outputs.reuse_vulkan == 'true' }}
    needs: [preflight]
    runs-on: ubuntu-latest

    steps:
      - name: Download ggml-vulkan artifact from previous run
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ needs.preflight.outputs.prev_run_id }}
          name: win-vulkan-x64
          path: ./vulkan
          github-token: ${{ github.token }}

      - name: Re-upload in current run
        uses: actions/upload-artifact@v7
        with:
          name: win-vulkan-x64
          path: ./vulkan/*
          archive: false
          if-no-files-found: error

      - name: Summary
        run: |
          echo "Reused Vulkan artifact from run ${{ needs.preflight.outputs.prev_run_id }}"
          ls -la ./vulkan/

  # ---------------------------------------------------------------------------
  # JOB 3b: Build Vulkan x64 from scratch
  # ---------------------------------------------------------------------------
  win-vulkan-x64:
    name: Vulkan x64 (build)
    if: ${{ inputs.build_vulkan && needs.preflight.outputs.reuse_vulkan != 'true' }}
    needs: [preflight]
    runs-on: windows-2025

    env:
      VULKAN_VERSION: 1.4.357.0

    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          curl.exe -o $env:RUNNER_TEMP/VulkanSDK-Installer.exe `
            -L "https://sdk.lunarg.com/sdk/download/${env:VULKAN_VERSION}/windows/vulkansdk-windows-X64-${env:VULKAN_VERSION}.exe"
          & "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" --accept-licenses --default-answer --confirm-command install
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\${env:VULKAN_VERSION}"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\${env:VULKAN_VERSION}\bin"

      - name: Install Ninja
        run: choco install ninja --no-progress

      - name: Build ggml-vulkan
        shell: pwsh
        run: |
          cmake -S . -B build `
            -DGGML_VULKAN=ON `
            -DGGML_NATIVE=OFF `
            -DGGML_CPU=OFF `
            -DGGML_BACKEND_DL=ON `
            -DLLAMA_BUILD_BORINGSSL=ON `
            -DLLAMA_BUILD_TESTS=OFF `
            -DLLAMA_BUILD_EXAMPLES=OFF
          cmake --build build --config Release --target ggml-vulkan

      - name: Pack
        shell: pwsh
        run: 7z a -snl llama-bin-win-vulkan-x64.zip .\build\bin\Release\ggml-vulkan.dll

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: win-vulkan-x64
          path: llama-bin-win-vulkan-x64.zip
          archive: false
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # JOB 4: Merge — injects the CPU binaries (llama-server, ggml-cpu, ...) into
  # each backend zip, so every final zip is a self-contained runnable package.
  # Skips cleanly if a backend wasn't built (its dispatch input was false).
  # ---------------------------------------------------------------------------
  package:
    name: Merge + final artifacts
    needs: [preflight, win-cpu-x64, win-cuda-x64, reuse-cuda-x64, win-vulkan-x64, reuse-vulkan-x64]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./artifact
          merge-multiple: false

      - name: Inspect downloads
        run: |
          set -eux
          find artifact -type f | sort

      - name: Merge CPU binaries into backend zips
        run: |
          set -eux
          mkdir -p release

          CPU_ZIP=""
          for f in artifact/win-cpu-x64/*.zip; do
            [ -e "$f" ] && CPU_ZIP="$f" && break
          done

          if [ -z "$CPU_ZIP" ]; then
            echo "No CPU build (build_cpu was false or failed) - copying backend zips as-is."
            for f in artifact/win-cuda-x64/llama-bin-win-cuda-*.zip; do
              [ -e "$f" ] && cp "$f" release/llama-bin-win-cuda-13.4-x64.zip || true
            done
            for f in artifact/win-vulkan-x64/llama-bin-win-vulkan-*.zip; do
              [ -e "$f" ] && cp "$f" release/llama-bin-win-vulkan-x64.zip || true
            done
          else
            echo "Merging CPU binaries from $CPU_ZIP into backend zips."
            tmp="$(mktemp -d)"
            unzip -q "$CPU_ZIP" -d "$tmp"

            cp "$CPU_ZIP" release/llama-bin-win-cpu-x64.zip

            for f in artifact/win-cuda-x64/llama-bin-win-cuda-*.zip; do
              [ -e "$f" ] || continue
              ( cd "$tmp" && zip -q -r "$PWD/$f" . )
              cp "$f" release/llama-bin-win-cuda-13.4-x64.zip
            done

            for f in artifact/win-vulkan-x64/llama-bin-win-vulkan-*.zip; do
              [ -e "$f" ] || continue
              ( cd "$tmp" && zip -q -r "$PWD/$f" . )
              cp "$f" release/llama-bin-win-vulkan-x64.zip
            done
          fi

          for f in artifact/win-cuda-x64-cudart/cudart-*.zip; do
            [ -e "$f" ] && cp "$f" release/ || true
          done

          echo "=== final release/ contents ==="
          ls -la release/

      - name: Upload final bundle
        uses: actions/upload-artifact@v7
        with:
          name: llama-bin-win-x64-bundle
          path: release/*
          archive: false
          if-no-files-found: error
